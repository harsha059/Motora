name: Motora Android APK Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Automated Tests
        run: flutter test

      - name: Build Android Debug APK
        run: |
          chmod +x android/gradlew
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          flutter build apk --debug --verbose 2>&1 | tee build_apk.log || {
            echo "::error::Flutter build apk failed! Printing failure log:"
            tail -n 100 build_apk.log
            exit 1
          }

      - name: Verify APK Artifact
        run: |
          echo "=== Searching for APK files ==="
          find /home/runner/work -name "*.apk" -ls || true

          if [ ! -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            FOUND_APK=$(find /home/runner/work -name "*debug*.apk" -o -name "*.apk" | head -n 1)
            if [ -n "$FOUND_APK" ]; then
              echo "Found APK at $FOUND_APK. Ensuring it is at build/app/outputs/flutter-apk/app-debug.apk"
              mkdir -p build/app/outputs/flutter-apk
              cp "$FOUND_APK" build/app/outputs/flutter-apk/app-debug.apk
            fi
          fi

          if [ ! -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            echo "::error::Expected APK artifact build/app/outputs/flutter-apk/app-debug.apk not found!"
            exit 1
          fi
          echo "Debug APK successfully verified:"
          ls -lh build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Motora-Android-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
